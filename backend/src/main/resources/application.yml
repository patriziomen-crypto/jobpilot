# Configurazione principale di JobPilot.
# Le credenziali reali stanno in application-local.yml (non versionato) e nelle variabili d'ambiente.
spring:
  application:
    name: jobpilot
  profiles:
    active: local
  datasource:
    url: jdbc:mysql://127.0.0.1:${JOBPILOT_DB_PORT:3307}/jobpilot?serverTimezone=Europe/Rome&characterEncoding=utf8
    username: ${JOBPILOT_DB_USER:jobpilot}
    password: ${JOBPILOT_DB_PASSWORD:jobpilot}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # lo schema lo gestisce Flyway, Hibernate lo verifica soltanto
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    time-zone: Europe/Rome

server:
  address: 127.0.0.1   # raggiungibile solo da questo PC
  port: ${JOBPILOT_PORT:8080}
  error:
    include-message: always

jobpilot:
  # Cartella dove finiscono i PDF generati (CV e lettere), una sottocartella per candidatura
  output-dir: ${JOBPILOT_OUTPUT_DIR:${user.home}/Desktop/Gestione-Linkedin/output}
  ai:
    model: claude-opus-5-5
    # chiave letta da ANTHROPIC_API_KEY (variabile d'ambiente) oppure da application-local.yml
    api-key: ${ANTHROPIC_API_KEY:}

logging:
  level:
    it.patrizio.jobpilot: INFO   # DEBUG solo in sviluppo (application-local.yml)
